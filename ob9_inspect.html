<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script>
// ── OB9 Access Gate: ต้อง login ผ่าน Portal ก่อนเสมอ ──
// หน้านี้ (Daily Inspection) จำกัดเฉพาะ Admin หรือพนักงานที่ Admin ให้สิทธิ์ Inspection เท่านั้น
(function(){
  try{
    var s = JSON.parse(sessionStorage.getItem('ob9_session')||'null');
    if(!s || !s.type){ location.replace('ob9_portal_new.html?target=inspection'); return; }
    if(s.isSuperAdmin) return; // Admin เข้าได้ทุกส่วนเสมอ
    if(s.type==='field' && !(s.permissions && s.permissions.inspection)){ location.replace('ob9_home.html'); return; }
  }catch(e){ location.replace('ob9_portal_new.html'); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OB9 — Daily Inspection</title>
<style>
:root{
  --bg:#f0f2f5;--card:#fff;--border:#e5e7eb;--text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --green:#059669;--green-bg:#d1fae5;--green-dk:#065f46;
  --amber:#d97706;--amber-bg:#fef3c7;--amber-dk:#92400e;
  --red:#dc2626;--red-bg:#fee2e2;--red-dk:#991b1b;
  --blue:#1e40af;--blue-mid:#3b82f6;--blue-bg:#dbeafe;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111827;--card:#1f2937;--border:#374151;--text:#f9fafb;--text2:#9ca3af;--text3:#6b7280;}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
select,input,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;outline:none;transition:border-color .2s}
select:focus,input:focus,textarea:focus{border-color:var(--blue-mid)}
textarea{resize:vertical;min-height:70px}

/* ซ่อนตัวเลขในกล่องปฏิทิน (input[type=date]) ที่โชว์ตามรูปแบบเครื่อง/เบราว์เซอร์ (เช่น MM/DD/YYYY แบบสหรัฐฯ)
   ซึ่งแก้ให้เป็นไทยตรงๆ ไม่ได้ — ซ่อนเฉพาะช่องที่มีข้อความไทยวางทับแทน (.date-native-hidden) กันไม่ให้กล่องดูว่างเปล่า/
   สีตัวอักษรกับพื้นหลังชนกัน ส่วนช่องอื่นที่ไม่มีข้อความไทยวางทับ ให้แสดงตัวเลขปกติของเบราว์เซอร์ไว้ อ่านออกเสมอ */
input[type="date"].date-native-hidden::-webkit-datetime-edit,
input[type="date"].date-native-hidden::-webkit-datetime-edit-fields-wrapper,
input[type="date"].date-native-hidden::-webkit-datetime-edit-text,
input[type="date"].date-native-hidden::-webkit-datetime-edit-month-field,
input[type="date"].date-native-hidden::-webkit-datetime-edit-day-field,
input[type="date"].date-native-hidden::-webkit-datetime-edit-year-field { color: transparent; }
input[type="date"]::-webkit-calendar-picker-indicator { opacity: 1; }
.date-field-wrap{position:relative}
.date-thai-overlay{position:absolute;left:13px;right:34px;top:0;height:100%;display:flex;align-items:center;
  font-size:13px;color:var(--text);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* HEADER */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;height:54px}
.logo{width:32px;height:32px;background:#059669;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.header-title h1{font-size:15px;font-weight:600}
.header-title p{font-size:11px;color:var(--text2)}
.header-nav{margin-left:auto;display:flex;gap:5px}
.nav-btn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer}
.nav-btn.active{background:var(--green-bg);border-color:var(--green);color:var(--green-dk)}

/* MAIN */
.main{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}

/* FORM GRID */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:10px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}

/* CHECKLIST */
.check-item{border-bottom:1px solid var(--border);padding:12px 16px}
.check-item:last-child{border-bottom:none}
.check-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.check-num{width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check-name{flex:1;font-size:13px;font-weight:500}
.check-cat{font-size:10px;color:var(--text3);padding:1px 6px;background:var(--bg);border-radius:20px;flex-shrink:0}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.status-btn{flex:1;min-width:80px;padding:8px 6px;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.status-btn:active{transform:scale(.97)}
.status-btn.sel-ok{background:var(--green-bg);border-color:var(--green);color:var(--green-dk)}
.status-btn.sel-warn{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-dk)}
.status-btn.sel-crit{background:var(--red-bg);border-color:var(--red);color:var(--red-dk)}
.check-note{display:none;margin-top:8px}
.check-note.visible{display:block}
.check-note input,.check-note textarea{font-size:12px;padding:7px 10px;width:100%;font-family:inherit;border:1.5px solid var(--border);border-radius:8px;resize:vertical;min-height:54px;line-height:1.5}
.check-note textarea:focus{border-color:var(--navy,#1A5FA8);outline:none}

/* PROGRESS BAR */
.progress-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s}

/* SUBMIT */
.submit-btn{width:100%;padding:14px;border-radius:10px;border:none;background:#059669;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.submit-btn:hover{background:#047857}
.submit-btn:active{background:#065f46;transform:scale(.98)}
.submit-btn:disabled{background:var(--border);color:var(--text3);cursor:not-allowed;transform:none}

/* HISTORY */
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.hist-row:last-child{border-bottom:none}
.hist-meta{color:var(--text2)}
.hist-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.h-green{background:var(--green-bg);color:var(--green-dk)}
.h-amber{background:var(--amber-bg);color:var(--amber-dk)}
.h-red{background:var(--red-bg);color:var(--red-dk)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;transition:transform .3s;z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* SUMMARY CARD */
.summary-counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sum-badge{flex:1;min-width:70px;padding:8px;border-radius:8px;text-align:center;font-size:11px;font-weight:600}
</style>
</head>

      <!-- Progress -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
        <span style="font-size:11px;color:var(--text3)">ความคืบหน้า: <span id="prog-txt">0/0</span></span>
        <span style="font-size:11px;color:var(--text3)" id="prog-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- CHECKLIST -->
  <div class="card" id="checklist-card">
    <div class="card-header" id="checklist-header">
      🔍 รายการตรวจ
      <span style="margin-left:auto;font-size:11px;color:var(--text3)">เลือกเครื่องจักรก่อน</span>
    </div>
    <div id="checklist-body">
      <div style="padding:40px;text-align:center;color:var(--text3)">
        <div style="font-size:36px;margin-bottom:8px">🔍</div>
        กรุณาเลือกเครื่องจักรก่อน
      </div>
    </div>
  </div>

  <!-- NOTES -->
  <div class="card">
    <div class="card-header">📝 หมายเหตุเพิ่มเติม</div>
    <div class="card-body">
      <textarea id="inp-notes" placeholder="สิ่งที่พบ / ข้อเสนอแนะ / ข้อมูลเพิ่มเติม..."></textarea>
    </div>
  </div>

  <!-- SUBMIT -->
  <button class="submit-btn" id="submit-btn" onclick="submitForm()">
    <span>💾</span> บันทึกผลการตรวจ
  </button>

  <!-- HISTORY -->
  <div class="card" style="margin-top:14px">
    <div class="card-header">📅 ประวัติการตรวจ (7 วันล่าสุด)</div>
    <div id="history-body" style="padding:0 16px">
      <div style="padding:24px 0;text-align:center;color:var(--text3);font-size:12px">ยังไม่มีประวัติ</div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<div id="inspDetailModal" onclick="if(event.target===this) closeInspDetail();"

  <div style="background:var(--card);border-radius:var(--radius);width:520px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);z-index:1">

// ── POSITION PICKER DATA (ported from ob9_wo_form.html — ระบบ/ชิ้นส่วน + รูปไดอะแกรม) ──

// สำหรับ IMG_MAP ใช้ prefix แบบสั้น (Conveyor Bridge ใช้รูปร่วมกับ Spreader)
function posImgPrefix(machine){ return machine==='Conveyor Bridge' ? 'Spreader' : machine; }

// machine/unit/unitCode ให้ตรงกับที่ ob9_dashboard.html คาดหวัง (เช่น "Spreader.A", "Tripper car.A", "A9")
// เดิม WO ที่สร้างจาก Daily Inspection บันทึก unit เป็น "A"/"B" ตรงๆ ไม่ตรงกับ Dashboard เลย
const UNIT_LINK_MAP = {
  'Spreader|A':         {machine:'Spreader ARs2400',   unit:'Spreader.A',    unitCode:'08-SP0002'},
  'Spreader|B':         {machine:'Spreader ARs2400',   unit:'Spreader.B',    unitCode:'08-SP0003'},
  'Tripper|A':          {machine:'Tripper Car Ü2200',  unit:'Tripper car.A', unitCode:'08-TP00001'},
  'Tripper|B':          {machine:'Tripper Car Ü2200',  unit:'Tripper car.B', unitCode:'08-TP00002'},
  'Line Shift|A1.1':    {machine:'Line Shift A1.1',    unit:'A1.1', unitCode:'08-SF00001'},
  'Line Shift|A9(BWE)': {machine:'Line Shift A9(BWE)', unit:'A9',   unitCode:'08-SF00002'},
  'Line Shift|B1.1':    {machine:'Line Shift B1.1',    unit:'B1.1', unitCode:'08-SF0003'},
};
function resolveUnitLink(friendlyMachine, rawUnit){
  const hit = UNIT_LINK_MAP[friendlyMachine+'|'+rawUnit];
  if(hit) return hit;
  const fallbackMachine = friendlyMachine==='Conveyor Bridge' ? 'Spreader ARs2400' : friendlyMachine;
  return {machine: fallbackMachine, unit: rawUnit||'', unitCode: rawUnit||''};
}

const DEFAULT_SYNC_TOKEN_INSPECT = 'ob9maemoh2569';

function getInspectSyncSettings(){
  try{

// ดึง WO จาก Google Sheet มา merge เข้าเครื่อง ก่อนจะสร้าง WO ใหม่จากผลตรวจ — กัน WO ของเครื่องอื่น
// ที่ sync เข้ามาไม่ทัน หายไปตอนเราเขียนทับ list (blind push ของ createWOsFromCritItems)
function pullWOsFromSheetForInspect(cb){
  const s = getInspectSyncSettings();
  if(!s.url){ if(cb) cb(); return; }
  const url = s.url + '?token=' + encodeURIComponent(s.token||'');
  fetch(url, {mode:'cors'})
    .then(r=>r.json())
    .then(d=>{
      if(d && d.ok && d.workOrders){
        const local = loadWOsForInspect();
        const byId = {};
        d.workOrders.forEach(w=>{ if(w && w.id) byId[w.id]=w; });
        // merge ระดับฟิลด์: ของเครื่อง (local) ชนะ ป้องกันฟิลด์ที่ Sheet ไม่ได้เก็บ (part/section ฯลฯ) หาย
        local.forEach(w=>{ if(w && w.id) byId[w.id] = Object.assign({}, byId[w.id]||{}, w); });
        localStorage.setItem('ob9_work_orders', JSON.stringify(Object.keys(byId).map(k=>byId[k])));
      }
    })
    .catch(()=>{ })
    .finally(()=>{ if(cb) cb(); });
}
function pushWOsToSheetForInspect(){
  const s = getInspectSyncSettings();
  if(!s.url) return;
  const pullUrl = s.url + '?token=' + encodeURIComponent(s.token||'');
  fetch(pullUrl, {mode:'cors'})
    .then(r=>r.json())
    .catch(()=>({ok:false, workOrders:[]}))
    .then(remote=>{
      const remoteWOs = (remote && remote.ok && remote.workOrders) ? remote.workOrders : [];
      const local = loadWOsForInspect();
      const byId = {};
      remoteWOs.forEach(w=>{ if(w && w.id) byId[w.id]=w; });
      local.forEach(w=>{ if(w && w.id) byId[w.id]=w; }); // local (มี WO ใหม่จากการตรวจ) ชนะ
      const merged = Object.keys(byId).map(k=>byId[k]);
      return fetch(s.url, {
        method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({token: s.token||'', workOrders: merged})
      });
    })
    .then(r=>r.json())
    .catch(()=>{ });
}

function pullInspectionsFromSheet(cb){
  const s = getInspectSyncSettings();
  if(!s.url){ if(cb) cb(); return; }
  const url = s.url + '?token=' + encodeURIComponent(s.token||'') + '&type=inspection';
  fetch(url, {mode:'cors'})

        const local = loadInspectionsLocal();

        const merged = Object.keys(byId).map(k=>byId[k]).sort((a,b)=> (b.ts||'').localeCompare(a.ts||''));
        localStorage.setItem('ob9_inspections', JSON.stringify(merged.slice(0,300)));
      }
    })
    .catch(()=>{ })
    .finally(()=>{ if(cb) cb(); });
}

  if(!s.url) return;
  const pullUrl = s.url + '?token=' + encodeURIComponent(s.token||'') + '&type=inspection';

    .then(r=>r.json())
    .catch(()=>({ok:false, inspections:[]}))

      // เพิ่มแจ้งเตือนที่นี่ด้วยเผื่อปัญหาเดียวกันเกิดกับหน้าตรวจเช็คหน้างาน (Daily Inspection)

// Extract [Pos.N] and clean part name from a SPARE_LOOKUP label
function extractPosPart(label){
  var m = (label||'').match(/^\[Pos\.([^\]]+)\]\s*(.*)$/);
  return m ? {pos:m[1], part:m[2]} : {pos:'', part:label||''};
}

// ── Blinking position circle overlay — per checklist item (แยก canvas ตาม id ได้หลายอันพร้อมกัน) ──
const _posCanvasState = {}; // id -> {raf, t0}

function _clearPosCanvasFor(id){
  const st = _posCanvasState[id];
  if (st && st.raf) { cancelAnimationFrame(st.raf); st.raf = null; }
  const c = document.getElementById('pos-canvas-'+id);
  if (c) { const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); }
}

function _drawPosCircleFor(id, pctX, pctY){
  _clearPosCanvasFor(id);
  const canvas = document.getElementById('pos-canvas-'+id);
  const img    = document.getElementById('pos-img-'+id);
  if (!canvas || !img || !img.naturalWidth) return;
  if (!img.offsetWidth || !img.offsetHeight) {
    setTimeout(function(){ _drawPosCircleFor(id, pctX, pctY); }, 60);
    return;
  }
  const pad = 0;
  canvas.width  = img.offsetWidth;
  canvas.height = img.offsetHeight;
  const availW  = img.offsetWidth  - pad*2;
  const availH  = img.offsetHeight - pad*2;
  const scale   = Math.min(availW / img.naturalWidth, availH / img.naturalHeight);
  const renderW = img.naturalWidth  * scale;
  const renderH = img.naturalHeight * scale;
  const offX    = pad + (availW - renderW) / 2;
  const offY    = pad + (availH - renderH) / 2;
  const cx = offX + pctX * renderW;
  const cy = offY + pctY * renderH;
  const R  = 6;
  const ctx = canvas.getContext('2d');
  if (!_posCanvasState[id]) _posCanvasState[id] = {raf:null, t0:null};
  _posCanvasState[id].t0 = null;
  function frame(ts){
    if (!_posCanvasState[id].t0) _posCanvasState[id].t0 = ts;
    const t = (ts - _posCanvasState[id].t0) / 1000;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const pulse = (Math.sin(t * 3.2) + 1) / 2;
    const ringR = R + 1.5 * pulse;
    const alpha = 0.7 + 0.3 * (1 - pulse);
    ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(220,50,50,' + alpha.toFixed(2) + ')';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    _posCanvasState[id].raf = requestAnimationFrame(frame);
  }
  _posCanvasState[id].raf = requestAnimationFrame(frame);
}

// เรียกทุกครั้งที่ pos เปลี่ยน (system เปลี่ยน หรือ part/position ถูกเลือก) — วาดวงกลมถ้ามีพิกัด ไม่มีก็เคลียร์เฉยๆ
function updatePosCircle(id, sys, pos){
  _clearPosCanvasFor(id);
  if (!sys || !pos) return;
  const coordMap = POS_COORDS[sys];
  if (!coordMap) return;
  const posKey = String(pos).replace(/^pos\.?\s*/i, '').trim();
  const coord = coordMap[posKey] || coordMap[pos];
  if (!coord) return;
  const img = document.getElementById('pos-img-'+id);
  if (img && img.complete && img.naturalWidth) {
    setTimeout(function(){ _drawPosCircleFor(id, coord[0], coord[1]); }, 60);
  } else if (img) {
    img.onload = function(){ setTimeout(function(){ _drawPosCircleFor(id, coord[0], coord[1]); }, 60); };
  }
}

function updateDateThaiPreview(inputId, previewId){
  var el = document.getElementById(inputId);
  var prev = document.getElementById(previewId);
  if (!el || !prev) return;
  if (!el.value) { prev.textContent = 'ยังไม่ได้เลือกวันที่ — กดไอคอน 📅 เพื่อเลือก'; return; }
  var d = new Date(el.value + 'T00:00:00');

  prev.textContent = 'วันที่: ' + d.toLocaleDateString('th-TH', {day:'numeric', month:'long', year:'numeric'});
}

/* ── บันทึกสถานะ checklist ลง localStorage อัตโนมัติ ── */
const DRAFT_KEY = 'ob9_inspect_draft';

function saveDraft(){
  const machine = document.getElementById('sel-machine').value;
  const unit = document.getElementById('sel-unit').value;
  const inspector = document.getElementById('inp-inspector').value.trim();
  const shift = document.getElementById('sel-shift').value;
  const date = document.getElementById('inp-date').value;
  const draft = { machine, unit, inspector, shift, date, answers, currentInspectionId };
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); }catch(e){}
}

function restoreDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.machine) return;
    // คืนค่า dropdown/input
    const selM = document.getElementById('sel-machine');
    if(selM && d.machine) selM.value = d.machine;
    const selU = document.getElementById('sel-unit');
    if(selU && d.unit) selU.value = d.unit;
    const inpI = document.getElementById('inp-inspector');
    if(inpI && d.inspector) inpI.value = d.inspector;
    const selS = document.getElementById('sel-shift');
    if(selS && d.shift) selS.value = d.shift;
    const inpD = document.getElementById('inp-date');
    if(inpD && d.date) inpD.value = d.date;
    // render checklist ก่อน แล้วค่อยใส่สถานะกลับ
    if(d.machine){
      onMachineChange();
      // เก็บ currentInspectionId เดิมไว้ (ไม่ใช้ตัวใหม่ที่ onMachineChange() เพิ่งสร้าง) เพื่อให้รูปที่แนบ
      // ต่อจากตรงนี้ยังเก็บลงโฟลเดอร์ Drive เดียวกับรูปที่แนบไปแล้วก่อนหน้า (ถ้ามี)
      if(d.currentInspectionId) currentInspectionId = d.currentInspectionId;
      if(d.answers){
        answers = d.answers;
        // วน apply สถานะกลับคืน
        Object.keys(answers).forEach(id=>{
          const s = answers[id].status;
          if(s) setStatus(id, s, true); // true = silent (ไม่ save draft ซ้ำ)
          const n = answers[id].note;
          if(n){
            const noteInp = document.getElementById('note-inp-'+id);
            if(noteInp) noteInp.value = n;
          }
          const photoBox = document.getElementById('photo-'+id);
          if(photoBox) photoBox.innerHTML = _inspPhotoThumbs(id);
        });
        updateProgress();
      }
    }
  }catch(e){}
}

function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

function setStatus(id, status, silent){
  if(!answers[id]) answers[id]={status:'',note:''};
  answers[id].status = status;
  // Update button styles
  ['ok','warn','crit'].forEach(s=>{
    const btn=document.getElementById(`btn-${s}-${id}`);
    if(btn){ btn.className='status-btn'+(status===s?` sel-${s}`:''); }
  });
  // Show note if warn or crit
  const noteEl=document.getElementById(`note-${id}`);
  if(noteEl) noteEl.className='check-note'+(status!=='ok'?' visible':'');
  if(status!=='ok') ensurePosSystemsPopulated(id);
  // Color the row
  const ci=document.getElementById(`ci-${id}`);
  if(ci) ci.style.background=status==='ok'?'var(--green-bg,#d1fae5)':status==='warn'?'var(--amber-bg,#fef3c7)':status==='crit'?'var(--red-bg,#fee2e2)':'';
  updateProgress();
  if(!silent) saveDraft(); // ← บันทึกอัตโนมัติทุกครั้งที่กดปุ่ม
}

function saveNote(id,val){
  if(!answers[id]) answers[id]={status:'',note:''};
  answers[id].note=val;
  saveDraft(); // ← บันทึกอัตโนมัติทุกครั้งที่พิมพ์หมายเหตุ
}

// ── PHOTO ATTACHMENTS (ต่อจุดตรวจ) ──────────────────────────────────────────
// (1 ส.ค. 69) ★ ใหม่ — ผู้ใช้แจ้งว่ารายการที่ผิดปกติควรบังคับแนบรูปด้วย เพื่อยืนยันสภาพจริงหน้างาน
// ทำตามแพทเทิร์นเดียวกับ ob9_wo_form.html: ย่อขนาดรูปก่อนเสมอ (กัน localStorage เต็ม) แล้วอัปโหลดขึ้น
// Google Drive ผ่าน Apps Script endpoint เดียวกัน (type:'uploadPhoto') ได้ URL สั้นๆ กลับมาแทน base64
// โฟลเดอร์ Drive ใช้ currentInspectionId (สร้างไว้ล่วงหน้าตอนเลือกเครื่องจักร) + item.id เป็นชื่อไฟล์
// เก็บผลลัพธ์ไว้ที่ answers[id].photos (array ของ URL/base64) — ไม่ต้องแก้ Code.gs เพิ่ม เพราะ photos จะ
// ติดไปกับ answers ที่ถูกเก็บเป็น JSON string ในคอลัมน์ "answers" อยู่แล้ว
const PHOTO_MAX_DIM_INSP = 900, PHOTO_QUALITY_INSP = 0.65;
function _resizeImageFileInsp(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > PHOTO_MAX_DIM_INSP || h > PHOTO_MAX_DIM_INSP) {
          if (w >= h) { h = Math.round(h*PHOTO_MAX_DIM_INSP/w); w = PHOTO_MAX_DIM_INSP; }
          else { w = Math.round(w*PHOTO_MAX_DIM_INSP/h); h = PHOTO_MAX_DIM_INSP; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY_INSP));
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
async function _uploadInspPhotoToDrive(dataUrl, folderKey, which){
  const s = getInspectSyncSettings();
  if (!s.url || !folderKey) return null;
  try {
    const filename = folderKey + '_' + which + '_' + Date.now() + '.jpg';
    const r = await fetch(s.url, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ token:s.token||'', type:'uploadPhoto', woId:folderKey, which:which, filename:filename, mimeType:'image/jpeg', dataBase64:dataUrl })
    });
    const j = await r.json();
    return (j && j.ok && j.url) ? j.url : null;
  } catch(e) { return null; }
}
function handleInspPhotoSelect(evt, itemId){
  const files = Array.from(evt.target.files||[]);
  evt.target.value = '';
  if (!files.length) return;
  if(!currentInspectionId) currentInspectionId = 'INS-'+Date.now();
  showToast('📷 กำลังประมวลผล + อัปโหลดรูป...');
  Promise.all(files.map(_resizeImageFileInsp)).then(async dataUrls=>{
    const uploaded = await Promise.all(dataUrls.map(function(du){
      return _uploadInspPhotoToDrive(du, currentInspectionId, itemId).then(function(url){ return url || du; });
    }));
    if(!answers[itemId]) answers[itemId]={status:'',note:''};
    if(!Array.isArray(answers[itemId].photos)) answers[itemId].photos=[];
    answers[itemId].photos.push(...uploaded);
    saveDraft();
    const box = document.getElementById('photo-'+itemId);
    if (box) box.innerHTML = _inspPhotoThumbs(itemId);
    showToast('✅ เพิ่มรูปแล้ว '+uploaded.length+' รูป');
  }).catch(()=>{ showToast('❌ โหลดรูปไม่สำเร็จ — ไฟล์อาจเสียหรือไม่ใช่รูปภาพ'); });
}
function removeInspPhoto(itemId, idx){
  if(!answers[itemId] || !Array.isArray(answers[itemId].photos)) return;
  answers[itemId].photos.splice(idx,1);
  saveDraft();
  const box = document.getElementById('photo-'+itemId);
  if (box) box.innerHTML = _inspPhotoThumbs(itemId);
}
function _inspPhotoThumbs(itemId){
  const arr = (answers[itemId] && answers[itemId].photos) || [];
  if (!arr.length) return '<div style="font-size:11px;color:var(--text3)">— ยังไม่มีรูป —</div>';
  return arr.map((src,i)=>`<div style="position:relative;display:inline-block">
      <img src="${src}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${src}','_blank')">
      <button onclick="event.stopPropagation();removeInspPhoto('${itemId}',${i})" style="position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#e74c3c;color:#fff;border:none;font-size:10px;line-height:16px;padding:0;cursor:pointer">×</button>
    </div>`).join('');
}

function updateProgress(){
  const machine=document.getElementById('sel-machine').value;
  const total=(CHECKLISTS[machine]||[]).length;
  const done=Object.keys(answers).filter(k=>answers[k].status).length;
  document.getElementById('prog-txt').textContent=`${done}/${total}`;
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=pct+'%';
}

// ── SUBMIT ────────────────────────────────────────────────────────────────
function submitForm(){
  const machine=document.getElementById('sel-machine').value;
  const unit=document.getElementById('sel-unit').value;
  const inspector=document.getElementById('inp-inspector').value.trim();
  const shift=document.getElementById('sel-shift').value;
  const date=document.getElementById('inp-date').value;
  if(!machine){ showToast('⚠️ กรุณาเลือกเครื่องจักร'); return; }
  if(!inspector){ showToast('⚠️ กรุณากรอกชื่อผู้ตรวจ'); return; }
  const items=CHECKLISTS[machine]||[];
  const done=items.filter(i=>answers[i.id]&&answers[i.id].status).length;
  if(done<items.length){ if(!confirm(`ยังตรวจไม่ครบ ${done}/${items.length} รายการ\nต้องการบันทึกต่อไหม?`)) return; }

  // (1 ส.ค. 69) ★ ใหม่ — บังคับแนบรูป + ระบุรายละเอียด สำหรับทุกจุดที่ผิดปกติ/แจ้งซ่อม (warn/crit)
  // ก่อนบันทึกได้ ตามที่ผู้ใช้แจ้ง: "ไม่เพิ่มรูปบันทึกไม่ได้ / ไม่ระบุรายละเอียดบันทึกไม่ได้"
  const flaggedItems = items.filter(i=>answers[i.id] && (answers[i.id].status==='warn' || answers[i.id].status==='crit'));
  for(const i of flaggedItems){
    const a = answers[i.id];
    if(!a.note || !a.note.trim()){
      showToast(`⚠️ กรุณาระบุรายละเอียด/อาการที่พบสำหรับ "${i.name}" ก่อนบันทึก`);
      const noteInp = document.getElementById('note-inp-'+i.id);
      if(noteInp) noteInp.focus();
      return;
    }
    if(!Array.isArray(a.photos) || a.photos.length===0){
      showToast(`⚠️ กรุณาแนบรูปสำหรับ "${i.name}" ก่อนบันทึก`);
      return;
    }
  }
  // บังคับหมายเหตุเพิ่มเติมโดยรวม ถ้ามีจุดผิดปกติอย่างน้อย 1 จุด
  const overallNotesEl = document.getElementById('inp-notes');
  if(flaggedItems.length>0 && (!overallNotesEl.value || !overallNotesEl.value.trim())){
    showToast('⚠️ กรุณาใส่หมายเหตุเพิ่มเติม (สรุปภาพรวม) ก่อนบันทึก เนื่องจากพบจุดผิดปกติ');
    overallNotesEl.focus();
    return;
  }

  // Save inspector name
  localStorage.setItem('ob9_inspector_name',inspector);

  // Build record
  const critItemObjs=items.filter(i=>answers[i.id]&&answers[i.id].status==='crit');
  const critItems=critItemObjs.map(i=>i.name);
  const warnItemObjs=items.filter(i=>answers[i.id]&&answers[i.id].status==='warn');
  const warnItems=warnItemObjs.map(i=>i.name);
  const record={
    id:currentInspectionId || ('INS-'+Date.now()), // ใช้ ID เดิมที่สร้างไว้ล่วงหน้า ให้ตรงกับโฟลเดอร์รูปใน Drive
    date,shift,machine,unit,inspector,
    total:items.length,done,
    ok_count:items.filter(i=>answers[i.id]&&answers[i.id].status==='ok').length,
    warn_count:warnItems.length,
    crit_count:critItems.length,
    crit_items:critItems,
    warn_items:warnItems,
    notes:document.getElementById('inp-notes').value,
    answers:{...answers},
    ts:new Date().toISOString()
  };

  // Save to localStorage
  const hist=JSON.parse(localStorage.getItem('ob9_inspections')||'[]');
  hist.unshift(record);
  localStorage.setItem('ob9_inspections',JSON.stringify(hist.slice(0,100)));

  // Update exec data if any crit/warn
  updateExecData(record);
  pushInspectionsToSheet(); // sync ประวัติการตรวจขึ้น Google Sheet ทันที

  showToast('✅ บันทึกเรียบร้อยแล้ว!');

  // ── Auto-create WO records (linked into Dashboard ทันที) if crit หรือ warn items ──
  // ⚠️ สำคัญ: ต้องทำงานนี้ "ก่อน" answers={} ด้านล่าง เพราะ createWOsFromCritItems อ่านรายละเอียด
  //    ที่พิมพ์ต่อจุด (answers[item.id].note) จากตัวแปร answers ตัวเดียวกัน — เดิมโค้ดรีเซ็ต answers={}
  //    ก่อนเรียกฟังก์ชันนี้ ทำให้รายละเอียดที่พิมพ์ไว้หายไปทุกครั้ง (WO ที่สร้างอัตโนมัติจะว่างเปล่าเสมอ
  //    ไม่ว่าจะพิมพ์อะไรก็ตาม) — แก้โดยย้ายมาทำก่อนล้างค่า answers
  if(critItemObjs.length>0 || warnItemObjs.length>0){
    const createdCritIds = critItemObjs.length>0
      ? createWOsFromCritItems(critItemObjs, machine, inspector, shift, date, unit, {priority:'critical', rpnSeverity:8, rpnScore:200, sourceLabel:'แจ้งซ่อม', inspectionNotes: record.notes})
      : [];
    const createdWarnIds = warnItemObjs.length>0
      ? createWOsFromCritItems(warnItemObjs, machine, inspector, shift, date, unit, {priority:'medium', rpnSeverity:5, rpnScore:125, sourceLabel:'ผิดปกติ', inspectionNotes: record.notes})
      : [];
    const createdIds = createdCritIds.concat(createdWarnIds);
    pushWOsToSheetForInspect(); // ส่งใบแจ้งซ่อมที่เพิ่งสร้างขึ้น Google Sheet ทันที
    setTimeout(()=>{
      let msg = `สร้างใบแจ้งซ่อมอัตโนมัติแล้ว ${createdIds.length} รายการ: ${createdIds.join(', ')}\n`;
      if(createdCritIds.length) msg += `🔴 แจ้งซ่อม: ${critItems.join(', ')}\n`;
      if(createdWarnIds.length) msg += `⚠️ ผิดปกติ: ${warnItems.join(', ')}\n`;
      msg += `\nข้อมูลเข้า Dashboard ทันที — ต้องการเปิดฟอร์มแจ้งซ่อมเพื่อเพิ่มรายละเอียด (มอบหมายช่าง / งบประมาณ) ไหม?`;
      if(confirm(msg)){
        openP('ob9_wo_form.html');
      }
    },600);
  }

  clearDraft(); // ← ล้าง draft หลัง submit สำเร็จ
  answers={};
  onMachineChange();
  document.getElementById('inp-notes').value='';
  renderHistory();
}

// ── AUTO-CREATE WO (link ข้อมูลแจ้งซ่อม/ผิดปกติเข้ากับ Dashboard/WO Form โดยตรง) ──────
function createWOsFromCritItems(critItemObjs, machine, inspector, shift, date, unit, opts){
  opts = opts || {};
  const priority = opts.priority || 'critical';
  const rpnSeverity = opts.rpnSeverity || 8;
  const rpnScore = opts.rpnScore || 200;
  const sourceLabel = opts.sourceLabel || 'แจ้งซ่อม';
  const WO_KEY='ob9_work_orders';
  let list;
  try{ list=JSON.parse(localStorage.getItem(WO_KEY)||'[]'); }catch(e){ list=[]; }
  const createdIds=[];
  const link=resolveUnitLink(machine, unit);
  critItemObjs.forEach(item=>{
    const woId='WO-'+String(list.length+1).padStart(4,'0');
    const a=answers[item.id]||{};
    const noteTxt=a.note||'';
    const posSys=a.sys||item.cat;
    const posPart=a.part||item.name;
    const posPos=a.pos||'';
    const record={
      id:woId,
      createdAt:new Date().toISOString(),
      machine:link.machine,
      unit:link.unit,
      unitCode:link.unitCode,
      section:posSys,
      pos:posPos,
      part:posPart,
      maintenanceType:'corrective',
      priority:priority,
      isPlannedMaintenance:false,
      failureMode:'',
      failureCause:'',
      failureEffect:'',
      detectionMethod:'visual',
      downtimeStart:null,
      downtimeEnd:null,
      downtimeDuration:null,
      downtimeType:null,
      shift:shift,
      rpnSeverity:rpnSeverity,
      rpnOccurrence:5,
      rpnDetection:5,
      rpnScore:rpnScore,
      laborRate:500,
      tdcMaterials:0,
      tdcLabor:0,
      productionImpact:null,
      conditionReadings:null,
      // เดิม: noteTxt || item.name — ถ้าพิมพ์รายละเอียดเอง ชื่อรายการมาตรฐาน (item.name) จะหายไปเลย
      // แก้ให้โชว์ทั้งคู่เสมอ (ชื่ออาการมาตรฐาน + รายละเอียดที่พิมพ์เพิ่ม) จะได้ไม่มีข้อมูลหายตอนแสดงผล
      description: noteTxt ? (item.name + ' — ' + noteTxt) : item.name,
      technicianName:'',
      laborHours:null,
      partsUsed:[],
      reporter:inspector,
      failedSystem:posSys,
      failedPart:posPart,
      failedPos:posPos,
      lessonLearned:'',
      nextMaintenanceDue:null,
      status:'pending',
      closedAt:null,
      // (1 ส.ค. 69) ★ ใหม่ — ผูกรูปที่แนบตอนตรวจเช็คมาเป็นรูป "ก่อนซ่อม" ของ WO ที่สร้างอัตโนมัติเลย
      // ไม่ต้องให้ช่างถ่ายซ้ำหน้างาน เพราะรูปหลักฐานสภาพผิดปกติมีอยู่แล้วตั้งแต่ตอนตรวจ
      imagesBefore: Array.isArray(a.photos) ? [...a.photos] : [],
      imagesAfter:[],
      dept:'',
      notes:`จาก Daily Inspection (${shift}) — ${sourceLabel}${noteTxt?': '+noteTxt:''}`,
      inspectionNotes: opts.inspectionNotes || '',
      spare:'',
      date:date,
      _source:'ob9_inspect',
    };
    list.push(record);
    createdIds.push(woId);
  });
  localStorage.setItem(WO_KEY, JSON.stringify(list));
  return createdIds;
}

function updateExecData(record){
  try{
    const ed=JSON.parse(localStorage.getItem('ob9_exec_data')||'{}');
    if(!ed.machines) ed.machines=[];
    // แก้บั๊ก: เดิมเก็บ key ด้วย record.machine อย่างเดียว (เช่น "Spreader") ทำให้ Spreader A กับ Spreader B
    // เขียนทับกันเองในช่องเดียว ไม่มีทางแยกดูราย Unit ได้เลยใน Executive Summary
    // ตอนนี้เก็บแยกเป็นราย Unit จริง (เช่น "Spreader A", "Spreader B") พร้อม group ไว้ให้ Executive ใช้จัดกลุ่ม
    const group = record.machine;
    const unitName = record.unit ? (group+' '+record.unit) : group;
    let m=ed.machines.find(x=>x.name===unitName);
    const status=record.crit_count>0?'red':record.warn_count>0?'amber':'green';
    const noteTxt=record.crit_count>0?`แจ้งซ่อม ${record.crit_count} รายการ`:record.warn_count>0?`ผิดปกติ ${record.warn_count} รายการ`:`ปกติ — ตรวจ ${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}`;
    if(m){ m.status=status; m.note=noteTxt; m.group=group; m.unit=record.unit||''; m.ts=record.ts; }
    else { ed.machines.push({name:unitName, group:group, unit:record.unit||'', status:status, oee:0, note:noteTxt, ts:record.ts}); }
    // ล้าง entry เก่าแบบไม่มี unit ที่ค้างมาจากก่อนแก้บั๊ก (ชื่อซ้ำกับ group แต่ไม่มี unit) เพื่อไม่ให้ขึ้นการ์ดซ้ำ
    if (record.unit) {
      ed.machines = ed.machines.filter(x => !(x.name === group && !x.unit));
    }
    ed._ts=new Date().toISOString();
    localStorage.setItem('ob9_exec_data',JSON.stringify(ed));
  }catch(e){}
}

// ── HISTORY ───────────────────────────────────────────────────────────────
function renderHistory(){
  const hist=JSON.parse(localStorage.getItem('ob9_inspections')||'[]');
  const el=document.getElementById('history-body');
  if(!hist.length){
    el.innerHTML='<div style="padding:24px 0;text-align:center;color:var(--text3);font-size:12px">ยังไม่มีประวัติ</div>';
    return;
  }
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-7);
  const recent=hist.filter(r=>new Date(r.ts)>=cutoff).slice(0,20);
  if(!recent.length){
    el.innerHTML='<div style="padding:24px 0;text-align:center;color:var(--text3);font-size:12px">ไม่มีประวัติใน 7 วันที่ผ่านมา</div>';
    return;
  }
  el.innerHTML=recent.map(r=>{
    const cls=r.crit_count>0?'h-red':r.warn_count>0?'h-amber':'h-green';
    const lbl=r.crit_count>0?`🔴 ${r.crit_count} แจ้งซ่อม`:r.warn_count>0?`⚠️ ${r.warn_count} ผิดปกติ`:'✅ ปกติ';
    const dt=new Date(r.ts).toLocaleString('th-TH',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-row" style="cursor:pointer" onclick="viewInspectionDetail('${r.id}')" title="ดูรายละเอียด">
      <div>
        <div style="font-size:12px;font-weight:500">${r.machine} — ${r.shift}</div>
        <div class="hist-meta">${dt} · ${r.inspector} · ${r.done}/${r.total} รายการ</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="hist-badge ${cls}">${lbl}</span>
        <span style="color:var(--text3);font-size:11px">›</span>
      </div>
    </div>`;
  }).join('');
}

// ── DETAIL VIEW: สรุปรายละเอียดการตรวจเช็คแบบย่อ (คลิกจากประวัติ) ──────────
function viewInspectionDetail(id){
  const hist = JSON.parse(localStorage.getItem('ob9_inspections')||'[]');
  const r = hist.find(x=>x.id===id);
  if(!r){ showToast('⚠️ ไม่พบข้อมูลนี้แล้ว'); return; }
  const dt = new Date(r.ts).toLocaleString('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const shiftLabel = {'Day-07':'กะเช้า 07:00–19:00','Night-19':'กะดึก 19:00–07:00','Day-06':'กะเช้า 06:00–14:00','Eve-14':'กะบ่าย 14:00–22:00','Night-22':'กะดึก 22:00–06:00'}[r.shift] || r.shift;

  // สรุปสถิติ
  const statsHtml = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
      <div style="text-align:center;padding:8px 4px;background:var(--bg);border-radius:8px">
        <div style="font-size:18px;font-weight:800;color:var(--green)">${r.ok_count||0}</div>
        <div style="font-size:10px;color:var(--text2)">ปกติ</div>
      </div>
      <div style="text-align:center;padding:8px 4px;background:var(--bg);border-radius:8px">
        <div style="font-size:18px;font-weight:800;color:var(--amber)">${r.warn_count||0}</div>
        <div style="font-size:10px;color:var(--text2)">ผิดปกติ</div>
      </div>
      <div style="text-align:center;padding:8px 4px;background:var(--bg);border-radius:8px">
        <div style="font-size:18px;font-weight:800;color:var(--red)">${r.crit_count||0}</div>
        <div style="font-size:10px;color:var(--text2)">แจ้งซ่อม</div>
      </div>
      <div style="text-align:center;padding:8px 4px;background:var(--bg);border-radius:8px">
        <div style="font-size:18px;font-weight:800;color:var(--text)">${r.done||0}/${r.total||0}</div>
        <div style="font-size:10px;color:var(--text2)">ตรวจครบ</div>
      </div>
    </div>`;

  // รายการที่พบปัญหา (ผิดปกติ + แจ้งซ่อม) — ดึงชื่อหัวข้อจริงจาก CHECKLISTS โดยจับคู่กับ answers
  // (1 ส.ค. 69) ★ แก้บั๊ก: เดิม Code.gs (Apps Script) ไม่มีคอลัมน์เก็บ "answers" (รายละเอียด/หมายเหตุต่อจุด
  // ตรวจ) เลย — พนักงานกรอกรายละเอียดตอนตรวจแล้ว แต่พอ sync ผ่าน Sheet ไปเครื่องอื่น (เช่น Admin เปิดดูจาก
  // เครื่องที่ไม่ได้ตรวจเอง) ข้อมูลนี้หายไปหมด กลายเป็นขึ้น "✅ ไม่พบจุดผิดปกติ" ทั้งที่ stats ด้านบนบอกว่ามี
  // รายการผิดปกติอยู่ — เพิ่มคอลัมน์ answers ใน Code.gs แล้ว (deploy v19) แต่ "ข้อมูลเก่า" ที่ sync ไปก่อนหน้านี้
  // จะยังไม่มี answers ย้อนหลังให้ (คอลัมน์ยังไม่มีตอนนั้น) จึงเพิ่ม fallback ตรงนี้: ถ้าไม่มี answers แต่
  // นับจำนวนผิดปกติ/แจ้งซ่อมได้ > 0 ให้แสดงชื่อรายการจาก warn_items/crit_items แทน (ข้อมูลนี้มีอยู่แล้วเสมอ)
  // พร้อมข้อความอธิบายว่าไม่มีรายละเอียดเพิ่มเติมบันทึกไว้ แทนที่จะโกหกว่า "ไม่พบจุดผิดปกติ"
  const items = CHECKLISTS[r.machine] || [];
  const answers = r.answers || {};
  const hasAnswersData = Object.keys(answers).length > 0;
  const flagged = items
    .map(it => ({ item: it, a: answers[it.id] }))
    .filter(x => x.a && (x.a.status==='warn' || x.a.status==='crit'))
    .sort((x,y) => (x.a.status==='crit'?0:1) - (y.a.status==='crit'?0:1));

  let flaggedHtml;
  if (flagged.length) {
    flaggedHtml = flagged.map(x => {
      const isCrit = x.a.status==='crit';
      const badge = isCrit ? '🔴 แจ้งซ่อม' : '⚠️ ผิดปกติ';
      const badgeColor = isCrit ? 'var(--red)' : 'var(--amber)';
      const badgeBg = isCrit ? 'var(--red-bg)' : 'var(--amber-bg)';
      return `<div style="padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:12px;font-weight:600;flex:1">${x.item.name}</span>
          <span style="font-size:10px;font-weight:700;color:${badgeColor};background:${badgeBg};padding:2px 8px;border-radius:10px;white-space:nowrap">${badge}</span>
        </div>
        ${x.a.note ? `<div style="font-size:11px;color:var(--text2);margin-top:4px">${x.a.note}</div>` : ''}
      </div>`;
    }).join('');
  } else if (!hasAnswersData && ((r.warn_count||0) + (r.crit_count||0) > 0)) {
    // ข้อมูลเก่าก่อนแก้บั๊ก — ไม่มี answers แต่มีชื่อรายการจาก crit_items/warn_items ให้แสดงแทนได้
    const oldFlagged = (r.crit_items||[]).map(n=>({name:n, isCrit:true}))
      .concat((r.warn_items||[]).map(n=>({name:n, isCrit:false})));
    flaggedHtml = `<div style="font-size:11px;color:var(--text3);margin-bottom:8px">⚠️ บันทึกนี้เป็นข้อมูลเก่าก่อนอัปเดตระบบ — มีเฉพาะชื่อรายการ ไม่มีรายละเอียด/หมายเหตุที่กรอกไว้ตอนตรวจ</div>`
      + oldFlagged.map(x => {
        const badge = x.isCrit ? '🔴 แจ้งซ่อม' : '⚠️ ผิดปกติ';
        const badgeColor = x.isCrit ? 'var(--red)' : 'var(--amber)';
        const badgeBg = x.isCrit ? 'var(--red-bg)' : 'var(--amber-bg)';
        return `<div style="padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span style="font-size:12px;font-weight:600;flex:1">${x.name}</span>
            <span style="font-size:10px;font-weight:700;color:${badgeColor};background:${badgeBg};padding:2px 8px;border-radius:10px;white-space:nowrap">${badge}</span>
          </div>
        </div>`;
      }).join('');
  } else {
    flaggedHtml = '<div style="text-align:center;padding:16px 0;color:var(--text3);font-size:12px">✅ ไม่พบจุดผิดปกติ — ผ่านทุกรายการ</div>';
  }

  document.getElementById('inspDetailBody').innerHTML = `
    <div style="font-size:12px;color:var(--text2);margin-bottom:2px">${dt} · ${shiftLabel}</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:6px">ผู้ตรวจ: <b>${r.inspector||'—'}</b></div>
    ${statsHtml}
    <div style="font-size:12px;font-weight:700;color:var(--text2);margin:10px 0 6px">รายการที่พบปัญหา</div>
    ${flaggedHtml}
    ${r.notes ? `<div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px">
      <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px">หมายเหตุเพิ่มเติม</div>
      <div style="font-size:12px;color:var(--text)">${r.notes}</div>
    </div>` : ''}
  `;
  document.getElementById('inspDetailModal').style.display = 'flex';
}
function closeInspDetail(){ document.getElementById('inspDetailModal').style.display = 'none'; }
</script>
</body>
</html>
