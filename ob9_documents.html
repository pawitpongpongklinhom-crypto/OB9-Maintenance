<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script>
// ── OB9 Access Gate: เฉพาะ Admin (super-admin) เท่านั้น ──
(function(){
  try{
    var s = JSON.parse(sessionStorage.getItem('ob9_session')||'null');
    if(!s || !s.type){ location.replace('ob9_portal_new.html'); return; }
    if(!s.isSuperAdmin){ location.replace('ob9_home.html'); return; }
  }catch(e){ location.replace('ob9_portal_new.html'); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OB9 — Document Center</title>
<style>
  :root {
    --accent:#F4A200; --navy:#1A5FA8; --navy-dk:#14213D; --bg:#F4F6FA;
    --text1:#14213D; --text3:#8A93A3; --border:#E2E6ED; --green:#16A34A; --red:#DC2626; --amber:#D97706;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text1); }
  .topnav{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;position:sticky;top:0;z-index:10}
  .tn-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
  .tn-logo{background:var(--accent);color:#000;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
  .tn-back{border:1.5px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 12px;background:transparent;color:#fff;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none}

  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:17px; margin:0 0 4px; color:var(--navy-dk); }
  .sub { font-size:12.5px; color:var(--text3); margin-bottom:20px; line-height:1.6; }

  .searchbar { margin-bottom:18px; }
  .searchbar input { width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; }

  .cat-title { font-size:13px; font-weight:700; color:var(--navy-dk); margin:22px 0 10px; display:flex; align-items:center; gap:8px; }
  .cat-count { font-size:11px; color:var(--text3); font-weight:500; }
  .doc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; }
  .doc-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:13px 15px; display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text1); transition:box-shadow .15s,border-color .15s; }
  .doc-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.06); border-color:var(--navy); }
  .doc-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .doc-icon.docx { background:#DBEAFE; color:var(--navy); }
  .doc-icon.xlsx { background:#DCFCE7; color:var(--green); }
  .doc-icon.pptx { background:#FEE2E2; color:var(--red); }
  .doc-name { font-size:12.5px; font-weight:700; margin-bottom:2px; word-break:break-word; }
  .doc-meta { font-size:10.5px; color:var(--text3); }
  .empty { text-align:center; color:var(--text3); padding:24px; font-size:12.5px; }
  .hint { font-size:11px; color:var(--text3); margin-top:6px; line-height:1.6; }
  /* ══ MOBILE (8 ส.ค. 69) ══ */
  @media (max-width: 768px) {
    .topnav { flex-wrap: wrap; height: auto; min-height: 50px; padding: 8px 12px; gap: 6px; }
    .tn-brand { font-size: 12.5px; }
    .wrap { padding: 16px 12px 40px; }
  }

</style>
</head>
<body>

<nav class="topnav">
  <div class="tn-brand">
    <div class="tn-logo">OB9</div>
    <span>Document Center</span>
  </div>
  <a class="tn-back" href="ob9_home.html">← กลับหน้าหลัก</a>
</nav>

<div class="wrap">
  <h1>Document Center (Admin เท่านั้น)</h1>
  <div class="sub">รวมเอกสาร/แบบฟอร์ม/รายงานทั้งหมดที่มีอยู่ในระบบไว้ที่เดียว ค้นหาแล้วกดเปิดไฟล์ได้ทันที — ไฟล์เหล่านี้เป็นไฟล์จริงที่อยู่ในโฟลเดอร์ OB9_System_Complete และ OB9_Documents อยู่แล้ว หน้านี้แค่ทำดัชนีค้นหาให้</div>

  <div class="searchbar">
    <input type="text" id="searchInp" placeholder="🔍 ค้นหาเอกสาร เช่น Budget, Work Order, PM Plan..." oninput="renderAll()">
  </div>

  <div id="docContainer"></div>
</div>

<script>
  // ── รายการเอกสารจริงที่มีอยู่ในระบบ (ตรวจสอบไฟล์จริงในโฟลเดอร์แล้วก่อนสร้างหน้านี้) ──
  const DOCS = [
    // แบบฟอร์มปฏิบัติงาน
    { name: '01_แผ่นงานซ่อม_Work_Order.xlsx', path: 'OB9_Documents/01_แผ่นงานซ่อม_Work_Order.xlsx', cat: 'แบบฟอร์มปฏิบัติงาน', type: 'xlsx' },
    { name: '10_Work_Permit_PTW.docx', path: 'OB9_Documents/10_Work_Permit_PTW.docx', cat: 'แบบฟอร์มปฏิบัติงาน', type: 'docx' },
    { name: '11_Job_Completion_Handover.docx', path: 'OB9_Documents/11_Job_Completion_Handover.docx', cat: 'แบบฟอร์มปฏิบัติงาน', type: 'docx' },
    { name: '12_RCA_Report.docx', path: 'OB9_Documents/12_RCA_Report.docx', cat: 'แบบฟอร์มปฏิบัติงาน', type: 'docx' },
    { name: '16_MOC_Management_of_Change.docx', path: 'OB9_Documents/16_MOC_Management_of_Change.docx', cat: 'แบบฟอร์มปฏิบัติงาน', type: 'docx' },
    // รายงานประจำงวด
    { name: '02_Weekly_Progress_Report.xlsx', path: 'OB9_Documents/02_Weekly_Progress_Report.xlsx', cat: 'รายงานประจำงวด', type: 'xlsx' },
    { name: '03_Monthly_Progress_Report.xlsx', path: 'OB9_Documents/03_Monthly_Progress_Report.xlsx', cat: 'รายงานประจำงวด', type: 'xlsx' },
    { name: '05_3M_Report.xlsx', path: 'OB9_Documents/05_3M_Report.xlsx', cat: 'รายงานประจำงวด', type: 'xlsx' },
    { name: '06_Weekly_Progress_Report.pptx', path: 'OB9_Documents/06_Weekly_Progress_Report.pptx', cat: 'รายงานประจำงวด', type: 'pptx' },
    { name: '13_Backlog_WO_Report.xlsx', path: 'OB9_Documents/13_Backlog_WO_Report.xlsx', cat: 'รายงานประจำงวด', type: 'xlsx' },
    { name: '15_KPI_Reliability_Trend.xlsx', path: 'OB9_Documents/15_KPI_Reliability_Trend.xlsx', cat: 'รายงานประจำงวด', type: 'xlsx' },
    // การเงิน / จัดซื้อ / ผู้รับเหมา
    { name: '04_Inventory_Control.xlsx', path: 'OB9_Documents/04_Inventory_Control.xlsx', cat: 'การเงิน / จัดซื้อ / ผู้รับเหมา', type: 'xlsx' },
    { name: '07_ขออนุมัติสั่งซื้อ_Purchase_Request.xlsx', path: 'OB9_Documents/07_ขออนุมัติสั่งซื้อ_Purchase_Request.xlsx', cat: 'การเงิน / จัดซื้อ / ผู้รับเหมา', type: 'xlsx' },
    { name: '08_Budget_เครื่องจักร.xlsx', path: 'OB9_Documents/08_Budget_เครื่องจักร.xlsx', cat: 'การเงิน / จัดซื้อ / ผู้รับเหมา', type: 'xlsx' },
    { name: '09_Annual_PM_Plan.xlsx', path: 'OB9_Documents/09_Annual_PM_Plan.xlsx', cat: 'การเงิน / จัดซื้อ / ผู้รับเหมา', type: 'xlsx' },
    { name: '14_Spare_Parts_Consumption.xlsx', path: 'OB9_Documents/14_Spare_Parts_Consumption.xlsx', cat: 'การเงิน / จัดซื้อ / ผู้รับเหมา', type: 'xlsx' },
    { name: '17_Contractor_Performance.xlsx', path: 'OB9_Documents/17_Contractor_Performance.xlsx', cat: 'การเงิน / จัดซื้อ / ผู้รับเหมา', type: 'xlsx' },
    // เอกสารสรุปโครงการ
    { name: 'OB9_Dashboard_Project_Summary.docx', path: 'OB9_Dashboard_Project_Summary.docx', cat: 'เอกสารสรุปโครงการ', type: 'docx' },
    { name: 'OB9_Executive_Presentation.pptx', path: 'OB9_Executive_Presentation.pptx', cat: 'เอกสารสรุปโครงการ', type: 'pptx' },
    { name: 'OB9_Inspect_SpareLink_Mapping.xlsx', path: 'OB9_Inspect_SpareLink_Mapping.xlsx', cat: 'เอกสารสรุปโครงการ', type: 'xlsx' },
    { name: 'OB9_Research_Report_2026.docx', path: 'OB9_Research_Report_2026.docx', cat: 'เอกสารสรุปโครงการ', type: 'docx' },
    { name: 'OB9_คู่มือการสร้าง_Dashboard.docx', path: 'OB9_คู่มือการสร้าง_Dashboard.docx', cat: 'เอกสารสรุปโครงการ', type: 'docx' },
    { name: 'OB9_คู่มือการใช้งานระบบ.docx', path: 'OB9_คู่มือการใช้งานระบบ.docx', cat: 'เอกสารสรุปโครงการ', type: 'docx' },
    { name: 'OB9_สรุปสิ่งที่ได้จากระบบ.docx', path: 'OB9_สรุปสิ่งที่ได้จากระบบ.docx', cat: 'เอกสารสรุปโครงการ', type: 'docx' },
  ];

  const CAT_ORDER = ['แบบฟอร์มปฏิบัติงาน', 'รายงานประจำงวด', 'การเงิน / จัดซื้อ / ผู้รับเหมา', 'เอกสารสรุปโครงการ'];
  const TYPE_ICON = { docx: '📄', xlsx: '📊', pptx: '📽️' };

  function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function renderAll() {
    const q = document.getElementById('searchInp').value.trim().toLowerCase();
    const filtered = q ? DOCS.filter(d => d.name.toLowerCase().includes(q) || d.cat.toLowerCase().includes(q)) : DOCS;

    if (filtered.length === 0) {
      document.getElementById('docContainer').innerHTML = `<div class="empty">ไม่พบเอกสารที่ตรงกับคำค้นหา</div>`;
      return;
    }

    let html = '';
    CAT_ORDER.forEach(cat => {
      const items = filtered.filter(d => d.cat === cat);
      if (items.length === 0) return;
      html += `<div class="cat-title">${escHtml(cat)} <span class="cat-count">(${items.length} ไฟล์)</span></div>`;
      html += `<div class="doc-grid">`;
      items.forEach(d => {
        html += `<a class="doc-card" href="${encodeURI(d.path)}" target="_blank" rel="noopener">
          <div class="doc-icon ${d.type}">${TYPE_ICON[d.type]}</div>
          <div>
            <div class="doc-name">${escHtml(d.name)}</div>
            <div class="doc-meta">${d.type.toUpperCase()}</div>
          </div>
        </a>`;
      });
      html += `</div>`;
    });
    document.getElementById('docContainer').innerHTML = html;
  }

  renderAll();
</script>
</body>
</html>
